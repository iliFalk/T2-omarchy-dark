# Omarchy Quattro surfaces — T2 Dark.

[bar]
background = "#262624"
background-alpha = 0.97
text = "#F0EDE5"
active = "#EF664D"
scale-with-font = true
size-horizontal = 26
size-vertical = 28

[hyprland]
active-border = "#4694EA"
active-border-foreground = "#F0EDE5"

[controls]
normal-color = "#F0EDE5"
normal-fill-alpha = 0.04
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color = "#4694EA"
hover-cursor-fill-alpha = 0.10
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.48

focus-color = "#4694EA"
focus-fill-alpha = 0.12
focus-border-width = 1
focus-border-alpha = 0.82

selected-color = "#4694EA"
selected-fill-alpha = 0.18
selected-border-width = 1
selected-border-alpha = 0.58

pressed-color = "#5AA8FF"
pressed-fill-alpha = 0.24
selection-color = "#4694EA"
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true
xs = 2
md = 4
control-padding-y = 5
panel-padding = 10

[font]
base-size = 12
heading = 16
icon-large = 18

[popups]
background = "#333331"
background-alpha = 0.97
text = "#F0EDE5"
border = "hyprland.active-border"
border-alpha = 1.0
border-width = 4

[tooltip]
background = "#333331"
background-alpha = 0.97
text = "#F0EDE5"
border = "#41413E"
border-alpha = 1.0
border-width = 1

[notifications]
background = "#333331"
background-alpha = 0.97
text = "#F0EDE5"
border = "hyprland.active-border"
border-alpha = 1.0
border-width = 4
countdown = "#EF664D"

[launcher]
background = "#333331"
background-alpha = 0.98
text = "#F0EDE5"
border = "hyprland.active-border"
border-alpha = 1.0
border-width = 6
scrim = "#0E0E0D"
scrim-alpha = 0.4
selected-background = "#1A1A18"
selected-background-alpha = 1.0
selected-text = "#4694EA"
selected-border = "#4694EA"
selected-border-alpha = 1.0
selected-border-width = 1

[menu]
background = "#333331"
background-alpha = 0.98
text = "#F0EDE5"
border = "hyprland.active-border"
border-alpha = 1.0
border-width = 5
scrim = "#0E0E0D"
scrim-alpha = 0.4
selected-background = "#1A1A18"
selected-background-alpha = 1.0
selected-text = "#4694EA"
selected-border = "#4694EA"
selected-border-alpha = 1.0
selected-border-width = 1

[polkit]
background = "#333331"
background-alpha = 0.97
text = "#F0EDE5"
text-error = "#EE9E93"
border = "hyprland.active-border"
border-error = "#EF664D"
border-alpha = 1.0
border-width = 6
scrim = "#0E0E0D"
scrim-alpha = 0.4
accent = "#4694EA"

[lock]
background = "#1A1A18"
background-alpha = 0.80
text = "#F0EDE5"
placeholder = "#989894B3"
text-error = "#EE9E93"
border = "hyprland.active-border"
border-active = "hyprland.active-border"
border-error = "#EF664D"
border-alpha = 1.0
border-width = 5
selection = "#4694EA"
selection-alpha = 0.45

[image-picker]
scrim = "#0E0E0D"
scrim-alpha = 0.4
text = "#1A1A18"
selected-border = "#4694EA"
selected-border-alpha = 1.0
unselected-border = "#41413E"
unselected-border-alpha = 0.6
