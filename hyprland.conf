# Hyprland — T2 Dark
# ────────────────────────────────────────────────────────────

general {
    col.active_border = rgb(4694EA)
    col.inactive_border = rgb(41413E)
    border_size = 6
    gaps_in = 5
    gaps_out = 5
}

group {
    col.border_active = rgba(4694EAee)
    col.border_inactive = rgb(41413E)

    groupbar {
        col.active = rgba(4694EA99)
        col.inactive = rgba(41413E88)
        text_color = rgb(F0EDE5)
        text_color_inactive = rgba(4694EAee)
    }
}

decoration {
  rounding = 4
  rounding_power = 3
  shadow {
  enabled = yes
  render_power = 8
  range = 16
  color = rgba(00000066)
  }
}
